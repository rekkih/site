<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Name</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lexend:wght@300;400;500&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Instrument Serif"', 'Georgia', 'serif'],
                        sans: ['Lexend', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        paper: '#f7f6f2',
                        ink: '#1b1a17',
                        'ink-mid': '#6b6a65',
                        'ink-dim': '#b0aea7',
                        accent: '#c05a28',
                    },
                },
            },
        };
    </script>

    <style>
        html,
        body {
            background-color: #f7f6f2;
            color: #1b1a17;
        }

        #drawing-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
            touch-action: none;
        }

        #content {
            position: relative;
            z-index: 10;
            pointer-events: none;
            animation: fadeUp .55s cubic-bezier(.22, .68, 0, 1.2) both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #content a,
        #content button {
            pointer-events: auto;
        }

        #clear-btn {
            position: fixed;
            bottom: 1.5rem;
            left: 1.6rem;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease, color .15s, border-color .15s;
            cursor: pointer;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: .68rem;
            font-weight: 300;
            letter-spacing: .04em;
            color: rgba(107, 106, 101, .65);
            background: rgba(247, 246, 242, .8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(176, 174, 167, .3);
            border-radius: 999px;
            padding: .28rem .75rem;
        }

        #clear-btn:hover {
            color: #c05a28;
            border-color: rgba(192, 90, 40, .3);
        }

        #clear-btn.show {
            opacity: 1;
            pointer-events: auto;
        }

        #draw-hint {
            position: fixed;
            bottom: 1.5rem;
            left: 1.6rem;
            z-index: 30;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: .3rem;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: .65rem;
            font-weight: 300;
            letter-spacing: .04em;
            color: rgba(176, 174, 167, .55);
            transition: opacity 1.8s ease;
        }

        #draw-hint.hide {
            opacity: 0;
        }

        #content a {
            transition: color .15s ease, opacity .15s ease;
        }

        .writing-section {
            width: 100%;
            border-collapse: collapse;
        }

        .writing-section thead th {
            text-align: left;
            font-size: .82rem;
            font-weight: 400;
            color: #b0aea7;
            padding-bottom: .75rem;
            border-bottom: 1px solid rgba(27, 26, 23, .1);
        }

        .writing-section td {
            padding: .8rem 0;
            border-bottom: 1px solid rgba(27, 26, 23, .07);
            vertical-align: middle;
        }

        .writing-section tr:last-child td {
            border-bottom: none;
        }

        .col-year {
            font-size: .9rem;
            color: #b0aea7;
            width: 5rem;
            padding-right: 1rem;
        }

        .col-title a {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: #1b1a17;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            transition: color .15s;
        }

        .col-title a:hover {
            color: #c05a28;
        }

        .col-date {
            text-align: right;
            font-size: .82rem;
            color: #b0aea7;
            white-space: nowrap;
            width: 4rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: .65rem;
            font-weight: 400;
            color: rgb(255, 0, 170);
            position: relative;
            padding: .1em .45em;
        }

        .badge svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        @keyframes draw-circle {
            to {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>

<body class="font-sans antialiased">

    <canvas id="drawing-canvas" aria-hidden="true"></canvas>

    <div id="draw-hint">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
        </svg>
        draw on me
    </div>

    <button id="clear-btn" aria-label="Clear drawing">clear ✕</button>

    <div id="content" class="min-h-screen">

        <div class="max-w-xl mx-auto px-7 sm:px-10 py-14">

            <!-- Header -->
            <div class="mb-12">
                <h1 class="font-serif text-[1.9rem] leading-tight tracking-tight mb-1">Your Name</h1>
                <p class="text-[.82rem] text-ink-mid">
                    Updated <time id="updated-date"></time>
                </p>
            </div>

            <!-- Writing -->
            <section>
                <table class="writing-section">
                    <thead>
                        <tr>
                            <th colspan="3">Writing</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="col-year">2026</td>
                            <td class="col-title">
                                <a href="/liveline">Liveline
                                    <span class="badge">New</span>
                                </a>
                            </td>
                            <td class="col-date">16/02</td>
                        </tr>
                        <tr>
                            <td class="col-year"></td>
                            <td class="col-title"><a href="/agentation">Agentation</a></td>
                            <td class="col-date">21/01</td>
                        </tr>
                        <tr>
                            <td class="col-year"></td>
                            <td class="col-title"><a href="/annotating">Annotating for agents</a></td>
                            <td class="col-date">16/01</td>
                        </tr>
                        <tr>
                            <td class="col-year"></td>
                            <td class="col-title"><a href="/morphing-icons-with-claude">Morphing icons with Claude</a>
                            </td>
                            <td class="col-date">13/01</td>
                        </tr>
                        <tr>
                            <td class="col-year">2025</td>
                            <td class="col-title"><a href="/honkish">Honkish</a></td>
                            <td class="col-date">23/05</td>
                        </tr>
                        <tr>
                            <td class="col-year">2024</td>
                            <td class="col-title"><a href="/family-values">Family Values</a></td>
                            <td class="col-date">08/07</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>

    </div>

    <script>
        (() => {
            const d = new Date();
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            document.getElementById('updated-date').textContent =
                `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
        })();

        (() => {
            const canvas = document.getElementById('drawing-canvas');
            const ctx = canvas.getContext('2d');
            const clearBtn = document.getElementById('clear-btn');
            const hint = document.getElementById('draw-hint');

            function resize() {
                let saved = null;
                if (canvas.width > 0 && canvas.height > 0) {
                    try {saved = ctx.getImageData(0, 0, canvas.width, canvas.height);} catch (_) { }
                }
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                applyStyle();
                if (saved) {try {ctx.putImageData(saved, 0, 0);} catch (_) { } }
            }

            function applyStyle() {
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = 'rgba(27,26,23,0.45)'; ctx.lineWidth = 2;
            }

            resize();
            window.addEventListener('resize', resize);

            let drawing = false, lx = 0, ly = 0, lt = 0, hasDrawn = false;

            function onFirstStroke() {
                if (hasDrawn) return;
                hasDrawn = true;
                hint.classList.add('hide');
                clearBtn.classList.add('show');
            }

            function beginStroke(x, y) {
                drawing = true; lx = x; ly = y; lt = performance.now();
                applyStyle();
                ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(27,26,23,0.45)'; ctx.fill();
            }

            function extendStroke(x, y) {
                if (!drawing) return;
                const now = performance.now(), dt = Math.max(now - lt, 1);
                const spd = Math.hypot(x - lx, y - ly) / dt;
                ctx.lineWidth = Math.max(1.2, Math.min(8, 4.5 / (spd * 0.13 + 0.6)));
                ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
                lx = x; ly = y; lt = now;
                onFirstStroke();
            }

            function endStroke() {drawing = false;}

            canvas.addEventListener('mousedown', e => beginStroke(e.clientX, e.clientY));
            canvas.addEventListener('mousemove', e => extendStroke(e.clientX, e.clientY));
            canvas.addEventListener('mouseup', endStroke);
            canvas.addEventListener('mouseleave', endStroke);

            canvas.addEventListener('touchstart', e => {
                e.preventDefault(); const t = e.touches[0];
                beginStroke(t.clientX, t.clientY);
            }, {passive: false});

            canvas.addEventListener('touchmove', e => {
                e.preventDefault(); const t = e.touches[0];
                extendStroke(t.clientX, t.clientY);
            }, {passive: false});

            canvas.addEventListener('touchend', endStroke);

            function clearCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hasDrawn = false; clearBtn.classList.remove('show');
            }

            canvas.addEventListener('dblclick', clearCanvas);
            clearBtn.addEventListener('click', clearCanvas);
            document.addEventListener('keydown', e => {if (e.key === 'Escape') clearCanvas();});

            setTimeout(() => hint.classList.add('hide'), 5000);
        })();
    </script>

</body>

</html>
